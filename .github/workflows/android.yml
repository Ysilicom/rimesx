name: Android checks

on:
  pull_request:
    branches: [main]
    paths: ['platforms/android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['platforms/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the Gradle wrapper
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PY
      - name: Install compile SDK in the runner SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Test Buffer, build development APK and run Lint
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug
      - name: Upload development APK and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RIMES-Android-DEV-${{ github.sha }}
          path: |
            platforms/android/app/build/outputs/apk/debug/*.apk
            platforms/android/app/build/reports/lint-results-debug.*
            platforms/android/core/build/test-results/test/
          retention-days: 14
          if-no-files-found: warn
      # No publishing, production signing keys, device install or macOS release gate.
