# RIMES mobile original minimal schema (Apache-2.0).
# Enhanced with standard fuzzy pinyin (平翘舌、前后鼻音、鼻边音、唇齿音).
schema:
  schema_id: rimes_pinyin
  name: RIMES pinyin
  version: "0.2.0"
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors: [ascii_composer, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - "erase/^hm$/"
    - "erase/^m$/"
    - "erase/^n$/"
    - "erase/^ng$/"
    - "abbrev/^([a-z]).+$/$1/"
    - "abbrev/^([zcs]h).+$/$1/"
    # --- 模糊音规则 (Fuzzy Pinyin) ---
    # 平翘舌互通 (zh/ch/sh <-> z/c/s)
    - "derive/^([zcs])h/$1/"
    - "derive/^([zcs])([^h])/$1h$2/"
    # 鼻音 / 边音互通 (l <-> n)
    - "derive/^l/n/"
    - "derive/^n/l/"
    # 唇齿音 / 舌根音互通 (f <-> h)
    - "derive/^f/h/"
    - "derive/^h/f/"
    # 卷舌 / 边音 (r <-> l)
    - "derive/^r/l/"
    - "derive/^l/r/"
    # 舌根音 (g <-> k)
    - "derive/^g/k/"
    - "derive/^k/g/"
    # 前后鼻音互通 (an/ang, en/eng, in/ing)
    - "derive/([ei])n$/$1ng/"
    - "derive/([ei])ng$/$1n/"
    - "derive/([au])n$/$1ng/"
    - "derive/([au])ng$/$1n/"
    - "derive/ian$/iang/"
    - "derive/iang$/ian/"
    - "derive/uan$/uang/"
    - "derive/uang$/uan/"
    - "derive/ong$/eng/"
    - "derive/eng$/ong/"
translator:
  dictionary: pinyin_simp
  prism: rimes_pinyin
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  spelling_hints: 0
  always_show_comments: false
  preedit_format: []
punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ':': '：'
    ';': '；'
