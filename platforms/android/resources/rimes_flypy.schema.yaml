# RIMES Android minimal flypy schema (Apache-2.0). No desktop includes or Lua.
# Enhanced with standard fuzzy pinyin (平翘舌、前后鼻音、鼻边音、唇齿音).
schema:
  schema_id: rimes_flypy
  name: RIMES flypy
  version: "0.2.0"
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors: [ascii_composer, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - "erase/^xx$/"
    # --- 模糊音规则 (Fuzzy Pinyin) ---
    # 平翘舌互通 (zh/ch/sh <-> z/c/s)
    - "derive/^([zcs])h/$1/"
    - "derive/^([zcs])([^h])/$1h$2/"
    # 鼻音 / 边音互通 (l <-> n)
    - "derive/^l/n/"
    - "derive/^n/l/"
    # 唇齿音 / 舌根音互通 (f <-> h)
    - "derive/^f/h/"
    - "derive/^h/f/"
    # 卷舌 / 边音 (r <-> l)
    - "derive/^r/l/"
    - "derive/^l/r/"
    # 舌根音 (g <-> k)
    - "derive/^g/k/"
    - "derive/^k/g/"
    # 前后鼻音互通 (an/ang, en/eng, in/ing)
    - "derive/([ei])n$/$1ng/"
    - "derive/([ei])ng$/$1n/"
    - "derive/([au])n$/$1ng/"
    - "derive/([au])ng$/$1n/"
    - "derive/ian$/iang/"
    - "derive/iang$/ian/"
    - "derive/uan$/uang/"
    - "derive/uang$/uan/"
    - "derive/ong$/eng/"
    - "derive/eng$/ong/"
    # --- 双拼映射规则 (Flypy) ---
    - "derive/^([jqxy])u$/$1v/"
    - "derive/^([aoe])([ioun])$/$1$1$2/"
    - "xform/^([aoe])(ng)?$/$1$1$2/"
    - "xform/iu$/Ⓠ/"
    - "xform/(.)ei$/$1Ⓦ/"
    - "xform/uan$/Ⓡ/"
    - "xform/[uv]e$/Ⓣ/"
    - "xform/un$/Ⓨ/"
    - "xform/^sh/Ⓤ/"
    - "xform/^ch/Ⓘ/"
    - "xform/^zh/Ⓥ/"
    - "xform/uo$/Ⓞ/"
    - "xform/ie$/Ⓟ/"
    - "xform/(.)i?ong$/$1Ⓢ/"
    - "xform/ing$|uai$/Ⓚ/"
    - "xform/(.)ai$/$1Ⓓ/"
    - "xform/(.)en$/$1Ⓕ/"
    - "xform/(.)eng$/$1Ⓖ/"
    - "xform/[iu]ang$/Ⓛ/"
    - "xform/(.)ang$/$1Ⓗ/"
    - "xform/ian$/Ⓜ/"
    - "xform/(.)an$/$1Ⓙ/"
    - "xform/(.)ou$/$1Ⓩ/"
    - "xform/[iu]a$/Ⓧ/"
    - "xform/iao$/Ⓝ/"
    - "xform/(.)ao$/$1Ⓒ/"
    - "xform/ui$/Ⓥ/"
    - "xform/in$/Ⓑ/"
    - "xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⒿⓀⓁⓏⓍⒸⓋⒷⓃⓂ/qwrtyuiopsdfghjklzxcvbnm/"
translator:
  dictionary: pinyin_simp
  prism: rimes_flypy
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  spelling_hints: 0
  always_show_comments: false
  preedit_format:
    - "xform/(^|[ '])aa/$1a/"
    - "xform/(^|[ '])ee/$1e/"
    - "xform/(^|[ '])oo/$1o/"
    - "xform/([bpmfdtnljqx])n/$1iao/"
    - "xform/(\\w)g/$1eng/"
    - "xform/(\\w)q/$1iu/"
    - "xform/(\\w)w/$1ei/"
    - "xform/([dtnlgkhjqxyvuirzcs])r/$1uan/"
    - "xform/(\\w)t/$1ve/"
    - "xform/(\\w)y/$1un/"
    - "xform/([dtnlgkhvuirzcs])o/$1uo/"
    - "xform/(\\w)p/$1ie/"
    - "xform/([jqx])s/$1iong/"
    - "xform/(\\w)s/$1ong/"
    - "xform/(\\w)d/$1ai/"
    - "xform/(\\w)f/$1en/"
    - "xform/(\\w)h/$1ang/"
    - "xform/(\\w)j/$1an/"
    - "xform/([gkhvuirzcs])k/$1uai/"
    - "xform/(\\w)k/$1ing/"
    - "xform/([jqxnlb])l/$1iang/"
    - "xform/(\\w)l/$1uang/"
    - "xform/(\\w)z/$1ou/"
    - "xform/([gkhvuirzcs])x/$1ua/"
    - "xform/(\\w)x/$1ia/"
    - "xform/(\\w)c/$1ao/"
    - "xform/([dtgkhvuirzcs])v/$1ui/"
    - "xform/(\\w)b/$1in/"
    - "xform/(\\w)m/$1ian/"
    - "xform/([aoe])\\1(\\w)/$1$2/"
    - "xform/(^|[ '])v/$1zh/"
    - "xform/(^|[ '])i/$1ch/"
    - "xform/(^|[ '])u/$1sh/"
    - "xform/([jqxy])v/$1u/"
    - "xform/([nl])v/$1ü/"
    - "xform/ü/v/"
punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ':': '：'
    ';': '；'
