# Isolated schema list for the Windows IME in-process typing tests.
# Do not use the product rime_ice default here: that scheme needs the full
# RIMES lua tree and is covered later on real hardware.
schema_list:
  - schema: rimes_e2e

menu:
  page_size: 5

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
