# Isolated schema list for the Windows IME in-process typing tests.
# The fixture uses the workbench's default schema ID, but its own tiny Lua-free
# table. The full product dictionary and Lua tree are covered on real hardware.
schema_list:
  - schema: rime_ice

menu:
  page_size: 5

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
